name: Publish DentalPro 2.0 (GitHub Pages)
# Public demo. Only synthetic patient records may be published.
on:
  push:
    branches: [main]
    paths:
      - index.html
      - src/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new DentalPro 2.0
        run: npm run verify
      - name: Prepare new DentalPro 2.0 website
        run: |
          mkdir -p public/src
          cp index.html public/index.html
          cp src/domain.mjs src/pricelist.mjs src/forms.mjs src/payments.mjs src/workflows.mjs src/compensation.mjs src/billing.mjs src/vlk.mjs src/store.mjs src/views.mjs src/styles.css public/src/
          echo 'User-agent: *' > public/robots.txt
          echo 'Disallow: /' >> public/robots.txt
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
