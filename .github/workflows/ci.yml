name: DentalPro 2.0 CI
on:
  push:
    branches: [main, feature/dentalpro-2-unified-demo]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, build and automated tests
        run: npm run verify
      - name: Downloadable demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: dentalpro-standalone-demo
          path: demo-standalone.html
          if-no-files-found: error
